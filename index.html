<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Lesson Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a single-column planning board — an identity header, then two
     labelled sections (Learning Objectives, Lesson Planner), each an
     editable table with typed columns, expanding text cells, and inline
     add-row / add-column controls. */
  :root {
    --paper:        #F3F4EE;
    --surface:      #FFFFFF;
    --ink:          #1E2A22;
    --ink-soft:     #5B6A5E;
    --ink-faint:    #8B968A;
    --accent:       #2E6F5E;   /* Learning Objectives */
    --accent-soft:  #E2EEE8;
    --accent-ink:   #1C4B3E;
    --accent2:      #B4802C;  /* Lesson Planner */
    --accent2-soft: #F5EAD3;
    --accent2-ink:  #7A5416;
    --line:         #DCDED3;
    --line-strong:  #C3C7B8;
    --danger:       #A8402A;
    --danger-soft:  #F4E1DB;
    --shadow:       0 1px 2px rgba(30,42,34,0.06), 0 6px 20px -8px rgba(30,42,34,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:        #161B17;
      --surface:      #1F251F;
      --ink:          #ECEEE7;
      --ink-soft:     #AAB4A5;
      --ink-faint:    #78826F;
      --accent:       #6FBFA3;
      --accent-soft:  #223A32;
      --accent-ink:   #B7E6D4;
      --accent2:      #E0AC5E;
      --accent2-soft: #3B2E17;
      --accent2-ink:  #F1CE93;
      --line:         #32392F;
      --line-strong:  #414B39;
      --danger:       #E2947F;
      --danger-soft:  #3A241E;
      --shadow:       0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -8px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:        #161B17;
    --surface:      #1F251F;
    --ink:          #ECEEE7;
    --ink-soft:     #AAB4A5;
    --ink-faint:    #78826F;
    --accent:       #6FBFA3;
    --accent-soft:  #223A32;
    --accent-ink:   #B7E6D4;
    --accent2:      #E0AC5E;
    --accent2-soft: #3B2E17;
    --accent2-ink:  #F1CE93;
    --line:         #32392F;
    --line-strong:  #414B39;
    --danger:       #E2947F;
    --danger-soft:  #3A241E;
    --shadow:       0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -8px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  body, input, select, textarea, button {
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
  }

  .page {
    max-width: 980px;
    margin: 0 auto;
    padding-inline: clamp(16px, 4vw, 40px);
    padding-block: clamp(24px, 5vw, 56px) 64px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* ---------- Hero / identity header ---------- */
  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(20px, 4vw, 34px);
    box-shadow: var(--shadow);
  }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .hero h1 {
    margin: 0 0 20px;
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .identity-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px 28px;
    align-items: end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1 1 320px;
    min-width: 0;
  }
  .field.field-narrow { flex: 0 1 260px; }
  .field label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .field input[type="text"],
  .field select {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--line-strong);
    background: transparent;
    color: var(--ink);
    font-size: 17px;
    padding: 6px 2px 10px;
    font-family: "Fraunces", ui-serif, Georgia, serif;
  }
  .field select { font-family: "Work Sans", sans-serif; font-size: 15px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field input[type="text"]::placeholder { color: var(--ink-faint); font-family: "Work Sans", sans-serif; }
  .field input[type="text"]:focus,
  .field select:focus { outline: none; border-bottom-color: var(--accent); }

  /* ---------- Section blocks ---------- */
  .block {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(18px, 3.5vw, 30px);
    box-shadow: var(--shadow);
  }
  .block[data-accent="objectives"] { border-top: 4px solid var(--accent); }
  .block[data-accent="planner"] { border-top: 4px solid var(--accent2); }

  .block-head { margin-bottom: 18px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .block[data-accent="objectives"] .tag { background: var(--accent-soft); color: var(--accent-ink); }
  .block[data-accent="planner"] .tag { background: var(--accent2-soft); color: var(--accent2-ink); }

  .block h2 {
    margin: 0 0 6px;
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: clamp(20px, 2.6vw, 25px);
  }
  .block .hint {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 62ch;
  }

  /* ---------- Table ---------- */
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-top: 4px;
  }
  table {
    width: 100%;
    min-width: 660px;
    border-collapse: collapse;
    background: var(--surface);
  }
  thead th {
    background: var(--paper);
    text-align: left;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-strong);
    vertical-align: middle;
  }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--paper) 55%, transparent); }

  td.col-narrow, th.col-narrow { width: 92px; }
  td.col-select, th.col-select { width: 190px; }
  td.col-wide, th.col-wide { min-width: 200px; }
  td.col-actions, th.col-actions { width: 40px; padding: 8px 6px; }

  .cell-text, .cell-area, .cell-select {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    padding: 6px 8px;
    font-family: inherit;
  }
  .cell-text:hover, .cell-area:hover, .cell-select:hover { background: var(--paper); }
  .cell-text:focus, .cell-area:focus, .cell-select:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--accent);
  }
  .col-mono .cell-text { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }
  .cell-area {
    resize: none;
    overflow: hidden;
    min-height: 38px;
    line-height: 1.4;
  }
  .cell-text::placeholder, .cell-area::placeholder { color: var(--ink-faint); }
  select.cell-select { cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 16px) center, calc(100% - 11px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .row-del {
    width: 24px; height: 24px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .row-del:hover { background: var(--danger-soft); color: var(--danger); }

  .th-label-row { display: flex; align-items: center; gap: 6px; }
  .th-label {
    outline: none;
    border-radius: 4px;
    padding: 2px 4px;
    min-width: 8px;
  }
  .th-label:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--line-strong); }
  .th-custom .th-label { border-bottom: 1px dashed var(--line-strong); }
  .col-del {
    border: none; background: transparent; color: var(--ink-faint);
    cursor: pointer; font-size: 13px; border-radius: 5px; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .col-del:hover { background: var(--danger-soft); color: var(--danger); }

  /* ---------- Table actions ---------- */
  .table-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn-add {
    border: 1.5px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .block[data-accent="objectives"] .btn-add:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .block[data-accent="planner"] .btn-add:hover { border-color: var(--accent2); color: var(--accent2-ink); background: var(--accent2-soft); }

  /* ---------- Footer ---------- */
  .foot {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-top: 4px;
  }
  .foot-export {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .btn-export {
    border: none;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    background: var(--accent);
    box-shadow: var(--shadow);
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn-export:hover { opacity: 0.92; }
  .btn-export:active { transform: translateY(1px); }
  .btn-export:disabled { opacity: 0.6; cursor: progress; }
  .btn-export-alt { background: var(--accent2); }
  .export-status {
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .foot-secondary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .save-status {
    font-size: 12.5px;
    color: var(--ink-faint);
    opacity: 0;
    transition: opacity .5s ease;
  }
  .save-status.show { opacity: 1; }
  .btn-ghost {
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px 2px;
  }
  .btn-ghost:hover { color: var(--danger); }
  .btn-ghost.confirming { color: var(--danger); font-weight: 600; text-decoration: none; }

  @media (max-width: 560px) {
    .identity-grid { flex-direction: column; align-items: stretch; }
    .field.field-narrow { flex-basis: auto; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <p class="eyebrow">Facilitator planning</p>
    <h1>Workshop Lesson Planner</h1>
    <div class="identity-grid">
      <div class="field">
        <label for="workshopName">Name of workshop</label>
        <input type="text" id="workshopName" placeholder="e.g. Inclusive Leadership Foundations">
      </div>
      <div class="field field-narrow">
        <label for="leadFacilitator">Lead facilitator</label>
        <select id="leadFacilitator">
          <option value="">Choose…</option>
          <option value="Educationalist">Educationalist</option>
          <option value="Clinical Faculty Team">Clinical Faculty Team</option>
          <option value="Both">Both</option>
        </select>
      </div>
    </div>
  </header>

  <section class="block" data-accent="objectives">
    <div class="block-head">
      <h2>Learning Objectives</h2>
      <p class="hint">What should participants know or be able to do by the end of this workshop?</p>
    </div>
    <div class="table-scroll">
      <table id="table-objectives">
        <thead><tr id="head-objectives"></tr></thead>
        <tbody id="body-objectives"></tbody>
      </table>
    </div>
    <div class="table-actions">
      <button type="button" class="btn-add" data-table="objectives" data-action="row">+ Add row</button>
      <button type="button" class="btn-add" data-table="objectives" data-action="col">+ Add column</button>
    </div>
  </section>

  <section class="block" data-accent="planner">
    <div class="block-head">
      <h2>Lesson Planner</h2>
      <p class="hint">Break the session into timed activities and note who's leading each one.</p>
    </div>
    <div class="table-scroll">
      <table id="table-planner">
        <thead><tr id="head-planner"></tr></thead>
        <tbody id="body-planner"></tbody>
      </table>
    </div>
    <div class="table-actions">
      <button type="button" class="btn-add" data-table="planner" data-action="row">+ Add row</button>
      <button type="button" class="btn-add" data-table="planner" data-action="col">+ Add column</button>
    </div>
  </section>

  <footer class="foot">
    <div class="foot-export">
      <button type="button" id="exportWordBtn" class="btn-export">Export as Word</button>
      <button type="button" id="exportPdfBtn" class="btn-export btn-export-alt">Export as PDF</button>
      <span id="exportStatus" class="export-status" aria-live="polite"></span>
    </div>
    <div class="foot-secondary">
      <button type="button" id="clearAllBtn" class="btn-ghost">Clear all fields</button>
      <span id="saveStatus" class="save-status" aria-live="polite">Saved in this browser</span>
    </div>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.8/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.umd.cjs"></script>
<script>
(function () {
  "use strict";
  var STORAGE_KEY = "workshopLessonPlanner_v1";
  var FACIL_OPTIONS = ["Educationalist", "Clinical Faculty Team", "Both"];

  function defaultState() {
    return {
      header: { workshopName: "", leadFacilitator: "" },
      tables: {
        objectives: {
          columns: [
            { id: "details", label: "Details", type: "area", custom: false, width: "wide" },
            { id: "number", label: "Number", type: "text", custom: false, width: "narrow" },
            { id: "assignDeveloper", label: "Assign Developer", type: "select", options: FACIL_OPTIONS.slice(), custom: false, width: "select" }
          ],
          rows: [ {}, {}, {}, {}, {} ]
        },
        planner: {
          columns: [
            { id: "time", label: "Time", type: "text", custom: false, width: "narrow", mono: true },
            { id: "activity", label: "Activity", type: "area", custom: false, width: "wide" },
            { id: "outcome", label: "Addresses Learning Outcome", type: "area", custom: false, width: "wide" },
            { id: "facilitator", label: "Lead Facilitator", type: "select", options: FACIL_OPTIONS, custom: false, width: "select" },
            { id: "notes", label: "Notes", type: "area", custom: false, width: "wide" }
          ],
          rows: [ {}, {}, {}, {}, {}, {}, {}, {} ]
        }
      }
    };
  }

  var PLACEHOLDERS = {
    details: "Describe the objective…",
    number: "01",
    time: "9:00–9:15",
    activity: "What happens in this activity?",
    outcome: "Which objective(s) does this address?",
    notes: "Materials, prompts, reminders…"
  };

  var state = loadState();

  // Backfills any default column that isn't present yet in a previously-saved
  // table (e.g. a column added to the template after the user already had a
  // browser draft), inserting it at its canonical position instead of always
  // appending, and leaves any custom columns/data the user already has alone.
  function reconcileTable(savedTable, defaultColumns) {
    var hasSaved = savedTable && Array.isArray(savedTable.columns);
    var columns = hasSaved ? savedTable.columns.slice() : [];
    defaultColumns.forEach(function (def, idx) {
      var exists = columns.some(function (c) { return c.id === def.id; });
      if (!exists) {
        var copy = Object.assign({}, def);
        if (def.options) copy.options = def.options.slice();
        columns.splice(Math.min(idx, columns.length), 0, copy);
      }
    });
    var rows = (hasSaved && Array.isArray(savedTable.rows) && savedTable.rows.length) ? savedTable.rows : [{}];
    return { columns: columns, rows: rows };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.tables) return defaultState();
      var defaults = defaultState();
      parsed.header = parsed.header || defaults.header;
      parsed.tables.objectives = reconcileTable(parsed.tables.objectives, defaults.tables.objectives.columns);
      parsed.tables.planner = reconcileTable(parsed.tables.planner, defaults.tables.planner.columns);
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  var saveTimer = null;
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        flashSaved();
      } catch (e) { /* storage unavailable — continue without persistence */ }
    }, 350);
  }

  var statusEl = document.getElementById("saveStatus");
  var flashTimer = null;
  function flashSaved() {
    if (!statusEl) return;
    statusEl.classList.add("show");
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { statusEl.classList.remove("show"); }, 1600);
  }

  function autosize(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  }

  function widthClass(col) {
    if (col.width === "narrow") return "col-narrow";
    if (col.width === "select") return "col-select";
    return "col-wide";
  }

  function buildHeadCell(tableKey, col) {
    var th = document.createElement("th");
    th.className = widthClass(col) + (col.custom ? " th-custom" : "");
    var row = document.createElement("div");
    row.className = "th-label-row";

    var label = document.createElement("span");
    label.className = "th-label";
    label.contentEditable = "true";
    label.spellcheck = false;
    label.textContent = col.label;
    label.setAttribute("aria-label", "Column name");
    label.addEventListener("input", function () {
      col.label = label.textContent;
      scheduleSave();
    });
    label.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); label.blur(); }
    });
    row.appendChild(label);

    if (col.custom) {
      var del = document.createElement("button");
      del.type = "button";
      del.className = "col-del";
      del.title = "Remove column";
      del.setAttribute("aria-label", "Remove column: " + col.label);
      del.textContent = "×";
      del.addEventListener("click", function () { removeColumn(tableKey, col.id); });
      row.appendChild(del);
    }

    th.appendChild(row);
    return th;
  }

  function buildDataCell(tableKey, col, row) {
    var td = document.createElement("td");
    td.className = widthClass(col) + (col.mono ? " col-mono" : "");
    var placeholder = PLACEHOLDERS[col.id] || (col.custom ? "Add detail…" : "");

    if (col.type === "select") {
      var sel = document.createElement("select");
      sel.className = "cell-select";
      var blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "Choose…";
      sel.appendChild(blank);
      (col.options || FACIL_OPTIONS).forEach(function (opt) {
        var o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        sel.appendChild(o);
      });
      sel.value = row[col.id] || "";
      sel.addEventListener("change", function () {
        row[col.id] = sel.value;
        scheduleSave();
      });
      td.appendChild(sel);
    } else if (col.type === "area") {
      var ta = document.createElement("textarea");
      ta.className = "cell-area";
      ta.rows = 1;
      ta.placeholder = placeholder;
      ta.value = row[col.id] || "";
      ta.addEventListener("input", function () {
        row[col.id] = ta.value;
        autosize(ta);
        scheduleSave();
      });
      td.appendChild(ta);
      requestAnimationFrame(function () { autosize(ta); });
    } else {
      var input = document.createElement("input");
      input.type = "text";
      input.className = "cell-text";
      input.placeholder = placeholder;
      input.value = row[col.id] || "";
      input.addEventListener("input", function () {
        row[col.id] = input.value;
        scheduleSave();
      });
      td.appendChild(input);
    }
    return td;
  }

  function render(tableKey) {
    var tbl = state.tables[tableKey];
    var headRow = document.getElementById("head-" + tableKey);
    var body = document.getElementById("body-" + tableKey);
    headRow.innerHTML = "";
    body.innerHTML = "";

    tbl.columns.forEach(function (col) {
      headRow.appendChild(buildHeadCell(tableKey, col));
    });
    var actionsTh = document.createElement("th");
    actionsTh.className = "col-actions";
    headRow.appendChild(actionsTh);

    tbl.rows.forEach(function (row) {
      var tr = document.createElement("tr");
      tbl.columns.forEach(function (col) {
        tr.appendChild(buildDataCell(tableKey, col, row));
      });
      var actionsTd = document.createElement("td");
      actionsTd.className = "col-actions";
      var del = document.createElement("button");
      del.type = "button";
      del.className = "row-del";
      del.title = "Remove row";
      del.setAttribute("aria-label", "Remove row");
      del.textContent = "×";
      del.addEventListener("click", function () {
        var idx = tbl.rows.indexOf(row);
        if (idx > -1) tbl.rows.splice(idx, 1);
        if (tbl.rows.length === 0) tbl.rows.push({});
        render(tableKey);
        scheduleSave();
      });
      actionsTd.appendChild(del);
      tr.appendChild(actionsTd);
      body.appendChild(tr);
    });
  }

  function addRow(tableKey) {
    state.tables[tableKey].rows.push({});
    render(tableKey);
    scheduleSave();
    var body = document.getElementById("body-" + tableKey);
    var lastRow = body.lastElementChild;
    if (lastRow) {
      var firstField = lastRow.querySelector("input, textarea, select");
      if (firstField) firstField.focus();
    }
  }

  function addColumn(tableKey) {
    var tbl = state.tables[tableKey];
    var id = "col_" + Date.now().toString(36) + Math.floor(Math.random() * 100);
    tbl.columns.push({ id: id, label: "New field", type: "area", custom: true, width: "wide" });
    render(tableKey);
    scheduleSave();
    var headRow = document.getElementById("head-" + tableKey);
    var labels = headRow.querySelectorAll(".th-label");
    var last = labels[labels.length - 1];
    if (last) {
      var range = document.createRange();
      range.selectNodeContents(last);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      last.focus();
    }
  }

  function removeColumn(tableKey, colId) {
    var tbl = state.tables[tableKey];
    tbl.columns = tbl.columns.filter(function (c) { return c.id !== colId; });
    render(tableKey);
    scheduleSave();
  }

  document.querySelectorAll(".btn-add").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var tableKey = btn.getAttribute("data-table");
      var action = btn.getAttribute("data-action");
      if (action === "row") addRow(tableKey);
      else addColumn(tableKey);
    });
  });

  var nameInput = document.getElementById("workshopName");
  nameInput.value = state.header.workshopName || "";
  nameInput.addEventListener("input", function () {
    state.header.workshopName = nameInput.value;
    scheduleSave();
  });

  var facilSelect = document.getElementById("leadFacilitator");
  facilSelect.value = state.header.leadFacilitator || "";
  facilSelect.addEventListener("change", function () {
    state.header.leadFacilitator = facilSelect.value;
    scheduleSave();
  });

  var clearBtn = document.getElementById("clearAllBtn");
  var clearArmed = false;
  var clearTimer = null;
  clearBtn.addEventListener("click", function () {
    if (!clearArmed) {
      clearArmed = true;
      clearBtn.textContent = "Click again to confirm";
      clearBtn.classList.add("confirming");
      clearTimer = setTimeout(function () {
        clearArmed = false;
        clearBtn.textContent = "Clear all fields";
        clearBtn.classList.remove("confirming");
      }, 3000);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    clearBtn.textContent = "Clear all fields";
    clearBtn.classList.remove("confirming");
    state = defaultState();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    nameInput.value = "";
    facilSelect.value = "";
    render("objectives");
    render("planner");
  });

  /* ---------- Export (Word / PDF) ---------- */
  var exportStatusEl = document.getElementById("exportStatus");
  var exportStatusTimer = null;
  function setExportStatus(msg) {
    if (!exportStatusEl) return;
    exportStatusEl.textContent = msg;
    if (exportStatusTimer) clearTimeout(exportStatusTimer);
    if (msg) exportStatusTimer = setTimeout(function () { exportStatusEl.textContent = ""; }, 5000);
  }

  function filledRows(tbl) {
    return tbl.rows.filter(function (row) {
      return tbl.columns.some(function (col) {
        return (row[col.id] || "").toString().trim() !== "";
      });
    });
  }

  function filenameBase() {
    var name = (state.header.workshopName || "workshop-lesson-planner").trim();
    var slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return slug || "workshop-lesson-planner";
  }

  function exportErrorMessage(err) {
    var code = err && err.code;
    if (code === "declined") return "Export cancelled.";
    if (code === "rate_limited") return "A save is already in progress — try again in a moment.";
    if (code === "too_large") return "That file is too large to export.";
    if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
      return "Exporting isn't available in this view.";
    }
    return "Something went wrong preparing the file.";
  }

  // Saves via the Claude artifact's file-save capability when this page is
  // running inside claude.ai (that sandbox blocks ordinary downloads, so it
  // must go through window.claude). Outside that sandbox — e.g. hosted on
  // GitHub Pages or opened as a local file — window.claude doesn't exist, so
  // this falls back to a plain browser download, which works fine there.
  async function saveFile(filename, blob) {
    var downloads = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("downloads") : null;
    if (downloads) {
      try {
        await downloads.save({ filename: filename, data: blob });
        setExportStatus("Saved.");
      } catch (err) {
        setExportStatus(exportErrorMessage(err));
      }
      return;
    }
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setExportStatus("Saved.");
    } catch (err) {
      setExportStatus("Something went wrong preparing the file.");
    }
  }

  function withBusyButton(btn, busyLabel, fn) {
    return async function () {
      var original = btn.textContent;
      btn.disabled = true;
      btn.textContent = busyLabel;
      setExportStatus("");
      try {
        await fn();
      } catch (err) {
        setExportStatus("Something went wrong preparing the file.");
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    };
  }

  var exportWordBtn = document.getElementById("exportWordBtn");
  var exportPdfBtn = document.getElementById("exportPdfBtn");

  exportWordBtn.addEventListener("click", withBusyButton(exportWordBtn, "Preparing…", async function () {
    if (typeof docx === "undefined") { setExportStatus("Word export isn't available right now."); return; }
    var accentObjectives = "2E6F5E";
    var accentPlanner = "B4802C";

    function tableFor(tbl, accentHex) {
      var cols = tbl.columns;
      var colWidth = Math.floor(100 / cols.length);
      var headerRow = new docx.TableRow({
        tableHeader: true,
        children: cols.map(function (c) {
          return new docx.TableCell({
            width: { size: colWidth, type: docx.WidthType.PERCENTAGE },
            shading: { fill: accentHex },
            margins: { top: 100, bottom: 100, left: 120, right: 120 },
            children: [new docx.Paragraph({ children: [new docx.TextRun({ text: c.label, bold: true, color: "FFFFFF", size: 20 })] })]
          });
        })
      });
      var rows = filledRows(tbl).map(function (row) {
        return new docx.TableRow({
          children: cols.map(function (c) {
            return new docx.TableCell({
              width: { size: colWidth, type: docx.WidthType.PERCENTAGE },
              margins: { top: 100, bottom: 100, left: 120, right: 120 },
              children: [new docx.Paragraph({ children: [new docx.TextRun({ text: (row[c.id] || "").toString(), size: 20 })] })]
            });
          })
        });
      });
      return new docx.Table({ width: { size: 100, type: docx.WidthType.PERCENTAGE }, rows: [headerRow].concat(rows) });
    }

    var doc = new docx.Document({
      sections: [{
        children: [
          new docx.Paragraph({ text: state.header.workshopName || "Workshop Lesson Planner", heading: docx.HeadingLevel.TITLE }),
          new docx.Paragraph({
            spacing: { after: 300 },
            children: [
              new docx.TextRun({ text: "Lead Facilitator: ", bold: true }),
              new docx.TextRun(state.header.leadFacilitator || "—")
            ]
          }),
          new docx.Paragraph({ text: "Learning Objectives", heading: docx.HeadingLevel.HEADING_1, spacing: { after: 160 } }),
          tableFor(state.tables.objectives, accentObjectives),
          new docx.Paragraph({ text: "", spacing: { after: 320 } }),
          new docx.Paragraph({ text: "Lesson Planner", heading: docx.HeadingLevel.HEADING_1, spacing: { after: 160 } }),
          tableFor(state.tables.planner, accentPlanner)
        ]
      }]
    });

    var blob = await docx.Packer.toBlob(doc);
    await saveFile(filenameBase() + ".docx", blob);
  }));

  exportPdfBtn.addEventListener("click", withBusyButton(exportPdfBtn, "Preparing…", async function () {
    if (typeof window.jspdf === "undefined") { setExportStatus("PDF export isn't available right now."); return; }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: "pt", format: "a4" });
    var marginX = 40;
    var pageWidth = doc.internal.pageSize.getWidth();
    var y = 56;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text(state.header.workshopName || "Workshop Lesson Planner", marginX, y);
    y += 22;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    doc.text("Lead Facilitator: " + (state.header.leadFacilitator || "—"), marginX, y);
    y += 24;

    function section(title, tbl, accentRgb) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text(title, marginX, y);
      y += 8;
      var rows = filledRows(tbl).map(function (row) {
        return tbl.columns.map(function (c) { return (row[c.id] || "").toString(); });
      });
      doc.autoTable({
        startY: y,
        margin: { left: marginX, right: marginX },
        head: [tbl.columns.map(function (c) { return c.label; })],
        body: rows,
        theme: "grid",
        styles: { fontSize: 9.5, cellPadding: 6, valign: "top", overflow: "linebreak" },
        headStyles: { fillColor: accentRgb, textColor: 255, fontStyle: "bold" },
        tableWidth: pageWidth - marginX * 2
      });
      y = doc.lastAutoTable.finalY + 28;
      if (y > doc.internal.pageSize.getHeight() - 80) { doc.addPage(); y = 56; }
    }

    section("Learning Objectives", state.tables.objectives, [46, 111, 94]);
    section("Lesson Planner", state.tables.planner, [180, 128, 44]);

    var blob = doc.output("blob");
    await saveFile(filenameBase() + ".pdf", blob);
  }));

  render("objectives");
  render("planner");

  window.addEventListener("resize", function () {
    document.querySelectorAll(".cell-area").forEach(autosize);
  });
})();
</script>
</body>
</html>
